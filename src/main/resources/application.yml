server:
  port: 8091

spring:
  application:
    name: trading-paging-list
  datasource:
    url: ${DB_URL:jdbc:h2:mem:paginglist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

# IntelliJ／bootRun 啟動後 Console 印常用 URL（見 StartupInfoLogger）
startup:
  info:
    enabled: true
    project-name: TradingPagingList
    frontend: vite            # none | static | vite
    auth: false
    h2: true
    api-docs: true
    frontend-port: 5174
    home-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
